<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Moved &middot; IGI Associate Readiness Profile</title>
<meta http-equiv="refresh" content="0;url=https://igi-feedback-attendance.vercel.app/admin.html#tab=t-arp-admin">
<link rel="canonical" href="https://igi-feedback-attendance.vercel.app/admin.html#tab=t-arp-admin">
<style>
  :root{--ink:#0f1115;--mut:#8a8f98;--line:rgba(255,255,255,.1);--gold:#c9a44c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:#f4f5f7;font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
       display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
  .card{max-width:430px;width:100%;text-align:center}
  .logo{height:34px;margin:0 auto 26px;display:block;opacity:.95}
  h1{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 10px}
  p{color:var(--mut);font-size:14px;margin:0 0 22px}
  .rule{height:1px;background:var(--line);margin:0 0 22px}
  a.go{display:inline-block;padding:11px 22px;border-radius:9px;background:var(--gold);color:#1a1405;
       font-weight:600;font-size:14px;text-decoration:none;letter-spacing:.01em}
  a.go:hover{filter:brightness(1.06)}
  .dots{color:var(--mut);font-size:12px;margin-top:18px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/igi-school-of-gemology-white-logo.svg"
         onerror="this.onerror=null;this.src='assets/igi-school-of-gemology-white-logo.png'" alt="IGI School of Gemology">
    <h1>Assessment admin has moved to the portal</h1>
    <p>Opening links, releasing results and granting client access are now under <strong>Associate Readiness</strong> in the admin portal. Sign in with your usual admin PIN.</p>
    <div class="rule"></div>
    <a class="go" id="go" href="https://igi-feedback-attendance.vercel.app/admin.html#tab=t-arp-admin">Open admin portal</a>
    <div class="dots">Redirecting&hellip;</div>
  </div>
<script>
  (function () {
    var base = "https://igi-feedback-attendance.vercel.app/admin.html#tab=t-arp-admin";
    var qs = '';
    var url = base + qs;
    var a = document.getElementById('go');
    if (a) a.href = url;
    // replace(), not assign(): Back must not bounce the visitor straight back here.
    setTimeout(function () { location.replace(url); }, 0);
  })();
</script>
</body>
</html>
