<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGI ARP — Batch Report</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-pale:#F9F3E3;--navy:#0D1B2E;--white:#FFFFFF;--off:#F7F5F0;--muted:#6B6357;--border:#E2DDD6;--teal:#1D9E75;--coral:#C9613A;--purple:#534AB7;--blue:#378ADD;--gap-fill:#C94A4A;--dev-fill:#B87A10;--str-fill:#1D9E75;--rm:4px;--sh:0 1px 4px rgba(13,27,46,0.07),0 4px 16px rgba(13,27,46,0.05)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:var(--off);color:var(--navy);min-height:100vh;font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased}
#app{max-width:860px;margin:0 auto;padding:32px 20px 80px}
.hidden{display:none!important}
/* ── GATE ── */
.gate-wrap{max-width:420px;margin:0 auto;padding:48px 0}
.gate-logo{display:flex;align-items:center;justify-content:center;min-height:118px;margin:-12px -8px 26px;background:linear-gradient(135deg,#0D1B2E 0%,#123A44 56%,#1D9E75 160%);border-top:3px solid var(--gold);box-shadow:var(--sh)}
.gate-logo img{width:250px;max-width:82%;height:auto;display:block}
.gate-card{background:#FFFFFF;border:1px solid #E2DDD6;border-top:3px solid #C9A84C;padding:36px 32px;box-shadow:0 1px 4px rgba(13,27,46,0.07),0 4px 16px rgba(13,27,46,0.05)}
.gate-eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.gate-card h2{font-family:"Playfair Display",serif;font-size:22px;font-weight:700;color:#0D1B2E;margin-bottom:6px;line-height:1.2}
.gate-card p{font-size:13px;color:#6B6357;margin-bottom:24px;line-height:1.6}
.field{margin-bottom:18px}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6B6357;margin-bottom:7px}
.field input{width:100%;padding:10px 0;border:none;border-bottom:2px solid #E2DDD6;background:transparent;font-family:"DM Sans",sans-serif;font-size:15px;color:#0D1B2E;outline:none;transition:border-color .2s;border-radius:0}
.field input:focus{border-bottom-color:var(--gold)}
.field input::placeholder{color:#B0A898}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.02em;border-radius:var(--rm)}
.btn-primary{background:#0D1B2E;color:#fff;border:none;width:100%;margin-top:8px}
.btn-primary:hover{background:#1a2f50}
.error-msg{font-size:12px;color:#C94A4A;padding:8px 12px;background:#FEF2F2;border-left:3px solid #C94A4A;margin-top:8px;display:none}
/* ── MASTHEAD ── */
.rpt-masthead{background:var(--navy);padding:36px 40px 28px;margin-bottom:0;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:2px solid #C9A84C}
.rpt-mh-left{flex:1;min-width:200px}
.rpt-eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.rpt-eyebrow::after{content:'';flex:1;height:1px;background:rgba(201,168,76,0.3)}
.rpt-client{font-family:"Playfair Display",serif;font-size:36px;font-weight:700;color:#fff;line-height:1.1;margin-bottom:6px}
.rpt-meta{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.8}
.rpt-mh-right{text-align:right;flex-shrink:0}
.rpt-mh-right img{height:36px;opacity:.85;display:block;margin-left:auto;margin-bottom:10px}
.rpt-conf{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.3)}
/* ── METRICS ── */
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);background:var(--white);margin-bottom:28px;box-shadow:var(--sh)}
.mc{padding:22px 20px;border-right:1px solid var(--border);position:relative}
.mc:last-child{border-right:none}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border)}
.mc.mg::before{background:var(--gold)}.mc.mg{background:linear-gradient(to bottom,rgba(201,168,76,0.04),transparent)}
.mc.mt::before{background:var(--teal)}.mc.mt{background:linear-gradient(to bottom,rgba(29,158,117,0.04),transparent)}
.mc.mr::before{background:var(--coral)}.mc.mr{background:linear-gradient(to bottom,rgba(201,97,58,0.04),transparent)}
.mv{font-family:"Playfair Display",serif;font-size:38px;font-weight:700;line-height:1;margin-bottom:6px;color:var(--navy)}
.ml{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ms{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
/* ── SECTION HEAD ── */
.sh{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--navy)}
.sh-num{font-family:"DM Mono",monospace;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.06em;flex-shrink:0}
.sh-title{font-family:"Playfair Display",serif;font-size:18px;font-weight:600;color:var(--navy)}
.sh-rule{flex:1;height:1px;background:var(--border)}
/* ── PANEL ── */
.panel{background:var(--white);border:1px solid var(--border);padding:36px 40px;margin-bottom:20px;box-shadow:var(--sh)}
.pt{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
/* ── BAND TRACK ── */
.band-track{height:6px;display:flex;overflow:hidden;margin:16px 0 12px;background:var(--border)}
.bs{height:100%;transition:width .9s cubic-bezier(0.4,0,0.2,1)}
.band-legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}
.bli{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--navy)}
.bld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* ── BENCHMARK TABLE ── */
.bench-t{width:100%;border-collapse:collapse;font-size:12px}
.bench-t tr{border-bottom:1px solid var(--border)}
.bench-t tr:last-child{border-bottom:none}
.bench-t td{padding:12px 0;vertical-align:top}
.b-range{font-family:"Playfair Display",serif;font-size:17px;font-weight:700;width:80px;padding-right:16px}
.b-band{font-weight:600;font-size:12px;width:100px;padding-right:16px}
.b-desc{font-size:11px;color:var(--muted);line-height:1.6}
.b-act{font-size:11px;color:var(--navy);font-weight:500;padding-left:16px;width:180px;line-height:1.5}
.b-bar{width:4px;padding-right:12px}
.b-bar span{display:block;width:4px;height:36px;border-radius:2px}
/* ── DOT HEATMAP ── */
.heatmap-wrap{overflow-x:auto;margin-bottom:4px}
.heatmap{border-collapse:collapse;width:100%;font-size:11px}
.heatmap thead tr{border-bottom:2px solid var(--navy)}
.heatmap th{padding:6px 4px 6px 0;text-align:left;font-weight:600;color:var(--muted);font-size:8px;letter-spacing:.04em;text-transform:uppercase;white-space:normal;max-width:52px;line-height:1.3}
.heatmap th.sc{max-width:52px;font-size:8px;word-wrap:break-word}
.heatmap tbody tr{border-bottom:1px solid var(--border)}
.heatmap tbody tr:hover{background:#FAFAF7}
.heatmap td{padding:5px 3px 5px 0;vertical-align:middle}
.heatmap td.an{font-weight:600;color:var(--navy);font-size:11px;white-space:nowrap;padding-right:6px}
.heatmap td.ar{font-weight:700;font-size:12px;font-family:"Playfair Display",serif;text-align:center;padding-right:4px}
.heatmap td.as{font-size:9px;font-weight:600;color:var(--muted);text-align:center;padding-right:4px;white-space:nowrap}
.dc{text-align:center;padding:4px 1px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.d-g{background:var(--gap-fill)}
.d-d{background:none;border:2px solid var(--dev-fill)}
.d-s{background:var(--str-fill);opacity:.2}
.heatmap tfoot tr{border-top:2px solid var(--navy)}
.heatmap tfoot td{padding:8px 3px;font-size:9px;font-weight:700;text-align:center;color:var(--navy)}
.hm-legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}
.hml{display:flex;align-items:center;gap:6px}
/* ── PRIORITY ── */
.pri-block{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.pri-block:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.pri-num{font-family:"DM Mono",monospace;font-size:28px;font-weight:400;color:var(--gold);line-height:1;margin-bottom:6px}
.pri-skill{font-size:16px;font-weight:600;color:var(--navy);margin-bottom:4px}
.pri-stat{font-size:12px;color:var(--muted);margin-bottom:8px}.pri-stat b{color:var(--coral);font-size:14px}
.pri-tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border:1px solid var(--gold);color:var(--gold);border-radius:var(--rm)}
/* ── ASSOC TABLE ── */
.at{width:100%;border-collapse:collapse;font-size:12px}
.at thead tr{border-bottom:2px solid var(--navy)}
.at th{padding:8px 12px 8px 0;text-align:left;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.at tbody tr{border-bottom:1px solid var(--border)}
.at tbody tr:hover{background:#FAFAF7}
.at td{padding:12px 12px 12px 0;vertical-align:top}
.atn{font-weight:600;font-size:13px;color:var(--navy)}
.atm{font-size:11px;color:var(--muted);margin-top:1px}
.ats{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;line-height:1}.score-bar{width:44px;height:4px;background:#E2DDD6;border-radius:2px;margin-top:5px;overflow:hidden}.score-fill{height:100%;border-radius:2px;transition:width .6s}
.atb{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.atst{font-size:11px;font-weight:600;color:var(--muted)}
.atg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.atgt{font-size:10px;font-weight:500;padding:2px 7px;background:#FEF2F2;color:#991B1B;border-radius:var(--rm)}
.atdt{font-size:10px;font-weight:500;padding:2px 7px;background:#FFF8E7;color:#7A5C00;border-radius:var(--rm)}
.bstr{width:3px;padding-right:12px}
.bstr span{display:block;width:3px;min-height:40px;border-radius:1px}
/* ── RISK ── */
.risk-block{border-left:3px solid var(--coral);padding:14px 18px;background:#FEF9F7;margin-bottom:12px}
.risk-title{font-size:11px;font-weight:600;color:var(--coral);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
/* ── CTA ── */
.cta-block{background:var(--navy);padding:40px;margin-bottom:20px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center}
.cta-ey{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.cta-title{font-family:"Playfair Display",serif;font-size:24px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:10px}
.cta-body{font-size:13px;color:rgba(255,255,255,0.65);line-height:1.7}
.cta-trl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:4px;margin-top:14px}
.cta-trn{font-size:16px;font-weight:700;color:var(--gold-light);margin-top:2px}.cta-sep{width:40px;height:1px;background:rgba(201,168,76,0.3);margin:12px 0}
.cta-act{flex-shrink:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn-print{background:transparent;color:var(--gold-light);border:1px solid rgba(201,168,76,0.4);padding:10px 20px;font-size:12px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;letter-spacing:.03em;border-radius:var(--rm);transition:all .18s}
.btn-print:hover{background:rgba(201,168,76,0.1)}
.conf{text-align:center;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
@page{margin:16mm 14mm;@bottom-center{content:"IGI ARP | Confidential | Page " counter(page) " of " counter(pages);font-size:8px;color:#6B6357;font-family:sans-serif}}@media(max-width:640px){.metrics-row{grid-template-columns:1fr 1fr}.mc{border-right:none;border-bottom:1px solid var(--border)}.rpt-masthead{padding:24px 20px}.rpt-client{font-size:26px}.cta-block{grid-template-columns:1fr;gap:20px}.panel{padding:20px}}
@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}body{background:#F7F5F0!important}.metrics-row,.panel,.rpt-masthead,.cta-block{box-shadow:none!important}.rpt-masthead{background:#0D1B2E!important}.cta-block{background:#0D1B2E!important}.mc.mg::before{background:#C9A84C!important;display:block!important}.mc.mt::before{background:#1D9E75!important;display:block!important}.mc.mr::before{background:#C9613A!important;display:block!important}.mc::before{display:block!important;-webkit-print-color-adjust:exact!important}.bs{-webkit-print-color-adjust:exact!important}.d-g{background:#C94A4A!important}.d-d{border-color:#B87A10!important}.atgt{background:#FEF2F2!important;color:#991B1B!important}.atdt{background:#FFF8E7!important;color:#7A5C00!important}.risk-block{background:#FEF9F7!important}.b-bar span{-webkit-print-color-adjust:exact!important}.bstr span{-webkit-print-color-adjust:exact!important}
  @page{size:A4 landscape;margin:10mm}
  .heatmap-wrap{overflow:visible!important}
  .heatmap{width:100%!important;font-size:7px!important;table-layout:fixed!important}
  .heatmap th{font-size:6px!important;padding:3px 2px!important;max-width:none!important;word-break:break-word!important;line-height:1.2!important}
  .heatmap th.sc{font-size:6px!important}
  .heatmap td{padding:3px 2px!important;font-size:7px!important}
  .heatmap td.an{font-size:7px!important;white-space:normal!important;word-break:break-word!important;padding-right:3px!important}
  .heatmap td.ar{font-size:8px!important}
  .dot{width:7px!important;height:7px!important}
  .panel{page-break-inside:avoid}.sh{page-break-after:avoid;break-after:avoid}.sh+.panel,.sh+.heatmap-wrap{page-break-before:avoid;break-before:avoid}}
</style>
</head>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby0kO9x-oSt3Tad92TPS2g22cFqEPsGNdQbV1Ko-idi3miM9A8ZswK2EFU5k6__fZe6Fg/exec';

const SKILLS = ['Occasion-led discovery','Emotion-before-product sequencing','Diamond knowledge accuracy','Objection handling','Story-led selling','Confident single recommendation','Post-sale relationship building','Multi-stakeholder selling','Upsell and cross-sell instinct','Technical accuracy under pressure'];

const SKILL_SHORT = ['Discovery','Emotion seq.','4Cs knowledge','Objection hdlg','Story selling','Recommendation','Post-sale rel.','Multi-stake','Upsell instinct','Tech accuracy'];

const RSP_ROLE_FIT = {
  PP:"Product-led interactions. Tends to present before exploring customer needs. Typically lower average transaction values and conversion rates.",
  TA:"Transactions completed with care, but need discovery depth. Solves surface requests without fully uncovering the occasion or emotional context.",
  PS:"Genuine problem-solver. Understands real customer needs but needs conviction in recommendation — tends to offer options rather than a single clear choice.",
  EA:"Top-tier professional. Strong expertise and relationship depth. Final step: consistent completion of every interaction with a defined next step.",
  TrA:"Reference standard. Customers seek out by name and refer. Development is about mentoring others to this level."
};

function gasGet(params, cb) {
  const url = GAS_URL + '?' + Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const cbName = '_rpCb_' + Date.now();
  const s = document.createElement('script');
  let done = false;
  window[cbName] = function(d){ done=true; delete window[cbName]; document.body.removeChild(s); cb(null,d); };
  s.onerror = function(){ if(!done){done=true;delete window[cbName];try{document.body.removeChild(s);}catch(x){} cb(new Error('err'),null);} };
  s.src = url + '&callback=' + cbName;
  document.body.appendChild(s);
  setTimeout(()=>{ if(!done){done=true;delete window[cbName];try{document.body.removeChild(s);}catch(x){} cb(new Error('timeout'),null);} }, 10000);
}

// Safe JSON parse — handles already-parsed objects, empty strings, bad JSON
function safeJson(s) {
  if (!s) return {};
  if (typeof s === 'object') return s;
  try { return JSON.parse(s); } catch(x) { return {}; }
}

function computeSkillGaps(c2sStyle, rspStageKey, fcsPct) {
  const analytical=c2sStyle==='Analytical', amiable=c2sStyle==='Amiable';
  const expressive=c2sStyle==='Expressive', driver=c2sStyle==='Driver';
  const rspNum={PP:1,TA:2,PS:3,EA:4,TrA:5}[rspStageKey]||1;
  const k=fcsPct;
  const s=(a,b)=>a||b||'developing';
  const strong=(c)=>c?'strong':null, gap=(c)=>c?'gap':null;
  return [
    s(strong(rspNum>=3&&(amiable||expressive)), gap(rspNum<=2&&(analytical||driver))),
    s(strong((amiable||expressive)&&rspNum>=3), gap((analytical||driver)&&rspNum<=2)),
    s(strong(k>=75), gap(k<55)),
    s(strong(rspNum>=4&&(driver||analytical)), gap(rspNum<=2&&(amiable||expressive))),
    s(strong((expressive||amiable)&&rspNum>=3), gap(analytical&&rspNum<=2)),
    s(strong((driver||analytical)&&rspNum>=3), gap(amiable&&rspNum<=2)),
    s(strong(rspNum>=4), gap(rspNum<=2)),
    s(strong((amiable||expressive)&&rspNum>=3), gap(driver&&rspNum<=2)),
    s(strong(rspNum>=3&&k>=65), gap(rspNum<=2||k<55)),
    s(strong(k>=75&&(analytical||driver)), gap(k<55))
  ];
}

function loadReport() {
  const batch = (document.getElementById('rBatch').value||'').trim().toUpperCase();
  const pass  = (document.getElementById('rPass').value||'').trim();
  const errEl = document.getElementById('gateErr');
  const btn   = document.getElementById('gateBtn');
  const loading = document.getElementById('gateLoading');
  errEl.style.display='none';
  if(!batch||!pass){ errEl.textContent='Please enter both batch code and password.'; errEl.style.display='block'; return; }
  btn.style.display='none'; loading.style.display='block';
  gasGet({action:'getBatchReport', batch, pass}, function(err, d){
    btn.style.display='flex'; loading.style.display='none';
    if(err || !d || d.status==='error'){
      errEl.textContent = (d&&d.reason==='wrong_password') ? 'Incorrect password.' : (d&&d.reason==='no_data') ? 'No data found for this batch code.' : 'Could not load report. Please try again.';
      errEl.style.display='block'; return;
    }
    if(!d.rows||!d.rows.length){ errEl.textContent='No assessments found for batch: '+batch; errEl.style.display='block'; return; }
    // Also fetch post-test results (no extra auth — batch already verified)
    gasGet({action:'getPostResults', batch}, function(err2, d2) {
      const postRows = (!err2 && d2 && d2.postRows) ? d2.postRows : [];
      renderReport(d.rows, batch, d.client||batch, d.trainerName||'', postRows);
    });
    document.getElementById('gateScreen').classList.add('hidden');
    document.getElementById('reportScreen').classList.remove('hidden');
  });
}

function toTitleCase(s) {
  if (!s) return s;
  return s.toLowerCase().replace(/(?:^|\s|[\-\/])\S/g, c => c.toUpperCase()).trim();
}

function renderReport(rows, batch, client, trainerName, postRows) {
  postRows = postRows || [];
  // Guard: filter out data-error rows (name present but RI=0 and band not a known band)
  const VALID_BANDS = ['Outstanding','Proficient','Developing','Foundation'];
  rows = rows.filter(r => {
    if (!r.name || !r.name.trim()) return false; // no name — skip
    const badBand = !VALID_BANDS.includes(r.band);
    const zeroRI  = !r.ri || parseFloat(r.ri) === 0;
    if (badBand && zeroRI) return false; // corrupted row — exclude
    return true;
  });
  const n = rows.length;
  const avgRI  = Math.round(rows.reduce((a,r)=>a+(parseFloat(r.ri)||0),0)/n);
  const avgFcs = Math.round(rows.reduce((a,r)=>a+(parseFloat(r.fcs)||0),0)/n);
  const bandColors = {Outstanding:'#C9A84C',Proficient:'#1D9E75',Developing:'#378ADD',Foundation:'#C9613A'};
  const bands = {Outstanding:0,Proficient:0,Developing:0,Foundation:0};

function renderHeatmapAndRest(rows, batch, n, skillMatrix, skillGapCounts, topGaps, knowledgeRisk, trainerName, bandColors, avgRI, avgFcs, avgColor, postRows) {
  const sorted = skillMatrix.sort((a,b)=>(parseFloat(b.ri)||0)-(parseFloat(a.ri)||0));
  const origOrder = skillGapCounts.sort((a,b)=>SKILLS.indexOf(a.skill)-SKILLS.indexOf(b.skill));

  const heatmapHtml = `
  <div class="sh"><span class="sh-num">02</span><span class="sh-title">Skills Gap Heatmap</span><span class="sh-rule"></span></div>
  <div class="panel">
    <div class="pt">Dot Matrix — Each dot represents one skill per associate</div>
    <div class="heatmap-wrap">
      <table class="heatmap">
        <thead>
          <tr>
            <th>Associate</th>
            <th>Location</th>
            <th style="text-align:center">Index</th>
            <th style="text-align:center">Stage</th>
            ${SKILL_SHORT.map(s=>`<th class="sc" title="${s}">${s}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${sorted.map(a=>`
            <tr>
              <td class="an">${a.name}</td>
              <td style="font-size:11px;color:var(--muted)">${a.branch||"—"}</td>
              <td class="ar" style="color:${parseFloat(a.ri)>=70?'var(--teal)':parseFloat(a.ri)>=55?'var(--blue)':'var(--coral)'}">${a.ri}</td>
              <td class="as">${a.rspKey}</td>
              ${a.gaps.map(g=>`<td class="dc"><span class="dot ${g==='gap'?'d-g':g==='developing'?'d-d':'d-s'}" title="${g}"></span></td>`).join('')}
            </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3" style="text-align:left;font-size:10px;font-weight:600;color:var(--muted);padding-left:0">Team Gaps</td>
            ${origOrder.map(sg=>`
              <td style="color:${sg.gapCount>n*0.5?'var(--gap-fill)':sg.gapCount>n*0.25?'var(--dev-fill)':'var(--muted)'}">
                ${sg.gapCount>0?'<b style="color:#C94A4A">'+sg.gapCount+'G</b>':'<span style="color:#1D9E75;font-size:8px">✓</span>'}
              </td>`).join('')}
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="hm-legend">
      <div class="hml"><span class="dot d-g" style="width:12px;height:12px;display:inline-block"></span> Gap — immediate training required</div>
      <div class="hml"><span class="dot d-d" style="width:12px;height:12px;display:inline-block"></span> Developing — coaching recommended</div>
      <div class="hml"><span class="dot d-s" style="width:12px;height:12px;display:inline-block"></span> Strong — maintain and build on</div>
    </div>
  </div>`;

  const priorityHtml = `
  <div class="sh"><span class="sh-num">03</span><span class="sh-title">Training Priorities</span><span class="sh-rule"></span></div>
  <div class="panel">
    <div class="pt">Top Skill Gaps Across the Team — Ranked by Urgency</div>
    ${topGaps.map((g,i)=>`
      <div class="pri-block">
        <div class="pri-num">0${i+1}</div>
        <div class="pri-skill">${g.skill}</div>
        <div class="pri-stat">${g.gapCount>0?'<strong style="color:var(--coral);font-size:14px">'+g.gapCount+'</strong> critical gap'+(g.gapCount!==1?'s':'')+' &nbsp;&bull;&nbsp; ':''}${Math.round(((g.gapCount+g.devCount)/n)*100)}% of team needs development</div>
        <span class="pri-tag">IGI Retail Sales Excellence Program</span>
      </div>`).join('')}
    ${knowledgeRisk.length>0?`
      <div class="risk-block">
        <div class="risk-title">⚠ Knowledge Risk — Immediate Action Required</div>
        <div style="font-size:12px;color:var(--navy);line-height:1.6">
          <strong>${knowledgeRisk.length} associate${knowledgeRisk.length!==1?'s':''}</strong> scored below 56% on Diamond Knowledge.

        </div>
        <div style="margin-top:8px;font-size:11px;color:var(--muted)">${knowledgeRisk.map(r=>r.name).join(' &nbsp;&bull;&nbsp; ')}</div>
      </div>
      <span class="pri-tag" style="margin-top:8px;display:inline-block">4Cs Knowledge Certification — Priority Track</span>
    `:''}
  </div>`;

  const assocHtml = `
  <div class="sh"><span class="sh-num">04</span><span class="sh-title">Individual Associate Profiles</span><span class="sh-rule"></span></div>

      <tbody>
        ${sorted.map(a=>{
          const bc = bandColors[a.band]||'#8A8070';
          const gapSkills = SKILLS.filter((_,i)=>a.gaps[i]==='gap');
          const devSkills = SKILLS.filter((_,i)=>a.gaps[i]==='developing');
          // 4Cs knowledge weakness from tag scores
          const aTags = safeJson(a.fcsTagsRaw);
          const weakCat = (() => {
            const cats = Object.entries(aTags).filter(([,v])=>v&&v.total>0)
              .map(([k,v])=>({k, pct:Math.round((v.correct/v.total)*100)}))
              .sort((a,b)=>a.pct-b.pct);
            return cats.length ? cats[0] : null;
          })();
          return `<tr>
            <td class="bstr"><span style="background:${bc}"></span></td>
            <td>
              <div class="atn">${a.name}</div>
              <div class="atm">${a.c2s}${a.desig?' &bull; '+a.desig:''}</div>
            </td>
            <td style="vertical-align:middle">
              <div style="font-size:12px;font-weight:600;color:var(--navy)">${a.branch||'—'}</div>
            </td>
            <td style="text-align:center;vertical-align:middle">
              <div class="ats" style="color:${bc}">${a.ri}</div>
              <div class="atb" style="color:${bc}">${a.band}</div>
              <div class="score-bar"><div class="score-fill" style="width:${a.ri}%;background:${bc}"></div></div>

            <td style="vertical-align:middle">
              <div class="atst">${a.rspLabel||a.rspKey}</div>
              <div style="font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5">${RSP_ROLE_FIT[a.rspKey]?RSP_ROLE_FIT[a.rspKey].split('.')[0]+'.':''}</div>

            <td>

    <div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:12px;font-weight:600;color:var(--navy)">Post-Training Test Completion</div>
        <div style="font-size:13px;font-weight:700;font-family:'DM Mono',monospace;color:${ctrColor}">${completedPost} of ${totalAssociates} associates</div>
      </div>
      <div style="height:8px;background:#F4F1EB;border-radius:4px;overflow:hidden">
        <div style="height:8px;background:${ctrColor};border-radius:4px;width:${pct}%;transition:width 1s ease"></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:5px">
        ${pct===100 ? '✅ All associates have completed the post-training test.'
          : completedPost===0 ? 'Post-training test not yet taken. Share the link: <strong>igi-arp-assessment.vercel.app/post-test</strong>'
          : `${totalAssociates-completedPost} associate${totalAssociates-completedPost!==1?'s':''} yet to complete. Share: <strong>igi-arp-assessment.vercel.app/post-test</strong>`}
      </div>
    </div>

    ${completedPost === 0 ? '<div style="text-align:center;padding:24px;font-size:13px;color:var(--muted)">Knowledge Impact Report will appear here once associates complete the post-training test.</div>' : `

    <!-- Overall summary strip -->
    <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
      <div style="flex:1;min-width:100px;background:#F4F1EB;border-radius:8px;padding:12px 14px;text-align:center">
        <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px">Avg Pre</div>
        <div style="font-size:22px;font-weight:700;font-family:'DM Mono',monospace;color:var(--navy)">${avgPreOverall}%</div>
      </div>
      <div style="flex:1;min-width:100px;background:#F4F1EB;border-radius:8px;padding:12px 14px;text-align:center">
        <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px">Avg Post</div>
        <div style="font-size:22px;font-weight:700;font-family:'DM Mono',monospace;color:var(--navy)">${avgPostOverall}%</div>
      </div>
      <div style="flex:1;min-width:100px;background:${readyBg(avgPostOverall)};border-radius:8px;padding:12px 14px;text-align:center">
        <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px">Team Readiness</div>
        <div style="font-size:16px;font-weight:700;font-family:'DM Mono',monospace;color:${readyColor(avgPostOverall)}">${readyLabel(avgPostOverall)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">Avg Post: ${avgPostOverall}%</div>
      </div>
    </div>

    <!-- Category bar chart -->
    <div style="margin-bottom:20px">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px">Team Average by Category</div>
      <div style="display:flex;gap:8px;font-size:10px;color:var(--muted);margin-bottom:8px">
        <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#8A8070;display:inline-block"></span>Pre-training</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--gold);display:inline-block"></span>Post-training</span>
      </div>
      ${CATS.map(c => {
        const a    = catAvg[c.key];
        const pp   = a.n > 0 ? Math.round(a.preSum /a.n) : 0;
        const qp   = a.n > 0 ? Math.round(a.postSum/a.n) : 0;
        const d    = qp - pp;
        const dStr = (d>0?'+':'')+d+'%';
        const dCol = d>=10?'#1a7a3c':d>=0?'#B87A10':'#C94A4A';
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;width:54px;flex-shrink:0">${c.label}</div>
          <div style="flex:1;display:flex;flex-direction:column;gap:3px">
            <div style="height:9px;background:#F4F1EB;border-radius:3px;overflow:hidden"><div style="height:9px;background:#8A8070;border-radius:3px;width:${pp}%"></div></div>
            <div style="height:9px;background:#F4F1EB;border-radius:3px;overflow:hidden"><div style="height:9px;background:var(--gold);border-radius:3px;width:${qp}%"></div></div>
          </div>
          <div style="font-size:11px;font-family:'DM Mono',monospace;color:var(--navy);width:28px;text-align:right;flex-shrink:0">${qp}%</div>
          <div style="font-size:11px;font-weight:700;color:${dCol};width:36px;flex-shrink:0">${dStr}</div>
        </div>`;
      }).join('')}
    </div>

    <!-- Per-associate table -->
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px">Associate Knowledge Comparison</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead>
        <tr style="border-bottom:2px solid #F4F1EB">
          <th style="text-align:left;padding:7px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Associate</th>
          <th style="text-align:left;padding:7px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Location</th>
          <th style="text-align:center;padding:7px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Pre</th>
          <th style="text-align:center;padding:7px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Post</th>
          <th style="text-align:center;padding:7px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Norm. Gain</th>
          <th style="text-align:center;padding:7px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Readiness</th>
        </tr>
      </thead>
      <tbody>
        ${compRows.sort((a,b)=>(b.postPct||0)-(a.postPct||0)).map(r => {
          if (!r.completed) return `<tr style="border-bottom:1px dotted #EDE9E2">
            <td style="padding:3px 8px"><span style="font-size:11px;font-weight:600;color:var(--navy)">${r.name}</span></td>
            <td style="padding:3px 8px;font-size:10px;color:var(--muted)">${r.branch||'—'}</td>
            <td style="text-align:center;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;padding:3px 8px">${r.prePct}%</td>
            <td colspan="3" style="text-align:center;color:#B0A898;font-size:10px;padding:3px 8px">⏳ Pending</td>
          </tr>`;
          const ng     = normGain(r.prePct, r.postPct);
          const highBase = r.prePct >= 75;
          // For high-baseline associates with alarming negative norm gain, show softer label
          const ngStr  = ng === null ? (r.prePct >= 100 ? 'Max Pre' : '—') :
                         (highBase && ng < -20) ? '↓ slight' :
                         (ng > 0 ? '+' : '') + ng + '%';
          const ngColor= ng === null ? 'var(--muted)' :
                         (highBase && ng < -20) ? '#B87A10' :
                         ng >= 0 ? '#1a7a3c' : '#C94A4A';
          const bg     = readyBg(r.postPct);
          const rl     = readyLabel(r.postPct);
          const rc     = readyColor(r.postPct);
          return `<tr style="background:${bg};border-bottom:1px solid rgba(255,255,255,0.6)">
            <td style="padding:8px 8px">
              <div style="font-weight:600;color:var(--navy)">${r.name}</div>
              <div style="font-size:10px;color:var(--muted)">${r.desig||''}${highBase?' · <span style="color:#B87A10">⭐ High Baseline</span>':''}</div>
            </td>
            <td style="padding:8px 8px;font-size:12px;color:var(--muted)">${r.branch||'—'}</td>
            <td style="text-align:center;font-family:'DM Mono',monospace;font-weight:600">${r.prePct}%</td>
            <td style="text-align:center;font-family:'DM Mono',monospace;font-weight:700;color:${rc}">${r.postPct}%</td>
            <td style="text-align:center;font-family:'DM Mono',monospace;font-weight:700;color:${ngColor}">${ngStr}</td>
            <td style="text-align:center">
              <span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:${bg};color:${rc};border:1px solid ${rc}">${rl}</span>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  </div>`;

  document.getElementById('reportScreen').innerHTML += heatmapHtml + priorityHtml + assocHtml + loc05Html + knowledgeHtml + glossHtml + ctaHtml;
}
</script>
</body>
</html>
