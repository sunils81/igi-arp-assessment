<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D1B2E">
<title>Team Readiness — IGI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-pale:#F9F3E3;--navy:#0D1B2E;--white:#FDFCF9;
--off:#F4F1EB;--muted:#8A8070;--border:rgba(201,168,76,0.2);--teal:#1D9E75;--coral:#C9613A;
--purple:#534AB7;--blue:#378ADD;--radius:12px;--shadow:0 4px 24px rgba(13,27,46,0.10)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--off);color:var(--navy);
line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto;
padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right))}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
border-bottom:3px solid var(--gold);padding-bottom:14px;margin-bottom:20px;flex-wrap:wrap}
.hdr h1{font-family:'Playfair Display',serif;font-size:25px;font-weight:600;line-height:1.2}
.hdr .who{font-size:13px;color:var(--muted);margin-top:2px}
.hdr .org{text-align:right;font-size:11.5px;color:var(--muted);line-height:1.6}
.hdr .org b{display:block;font-family:'Playfair Display',serif;font-size:17px;color:var(--navy)}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
padding:22px 20px;margin-bottom:16px}
h2{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;margin-bottom:3px}
.sub{font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px;margin:14px 0}
.kv>div{background:var(--off);border-radius:9px;padding:11px 13px}
.kv span{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kv b{font-size:19px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
color:var(--muted);padding:8px 9px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:9px;border-bottom:1px solid #EFE9DC;vertical-align:top}
tr:last-child td{border-bottom:none}
.tc{text-align:center}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700}
.bar{height:7px;background:#E6DFCF;border-radius:7px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:7px}
.note{background:var(--gold-pale);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;
padding:12px 14px;font-size:13px;margin:12px 0}
.spin{text-align:center;padding:60px 20px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}
.btn{background:var(--gold);color:var(--navy);border:none;border-radius:9px;padding:11px 22px;
font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
@media(max-width:700px){
  .wrap{padding-left:max(13px,env(safe-area-inset-left));padding-right:max(13px,env(safe-area-inset-right))}
  .card{padding:17px 15px}
  .hdr h1{font-size:21px}
  .kv{grid-template-columns:1fr 1fr;gap:9px}
  .kv b{font-size:17px}
  table{font-size:12.5px}
  .scroll{margin:0 -15px;padding:0 15px}
}
@media print{
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #E6DFCF;break-inside:avoid}
  .noprint{display:none!important}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="spin">Loading your team&rsquo;s readiness&hellip;</div></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Client manager dashboard.

   The whole page is one call to arp_client_report, which takes the manager's token
   and returns their own batches and nobody else's. The scoping is the WHERE clause
   of a security-definer function, not a filter here, so there is nothing this page
   could ask for that would widen it: the ARP tables have no anon read policy at
   all. Expiry and revocation are checked in that same function, so a dead token
   stops working whatever page presents it.

   What the client never sees, by design: course fee, invoice, discount, GST, any
   other client's name, any participant outside their own batches.
   ═══════════════════════════════════════════════════════════════════════════ */
var SB = 'https://atbexvtrcopaagcdbpqi.supabase.co/rest/v1';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0YmV4dnRyY29wYWFnY2RicHFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNDI0MDgsImV4cCI6MjA5NjkxODQwOH0.4hl6Hs2ZnDW6vSMiRTOkp9sR-93v5dpTjC0uNuticBM';
var TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();

var BAND_COLOUR = { Outstanding: '#C9A84C', Proficient: '#1D9E75', Developing: '#378ADD', Foundation: '#C9613A' };
var STAGE_LABEL = { PP: 'Product Pusher', TA: 'Transaction Achiever', PS: 'Problem Solver',
                    EA: 'Expert Advisor', TrA: 'Trusted Advisor' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/* Dates are cut from the YYYY-MM-DD string rather than parsed: new Date('2026-10-06')
   is the 5th west of Greenwich, and a report dated a day early is worse than one with
   no dates at all. */
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dateRange(a, b) {
  function p(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); 
    return m ? { y: m[1], m: +m[2], d: +m[3] } : null; }
  var x = p(a), y = p(b) || x;
  if (!x) return '';
  if (x.y === y.y && x.m === y.m && x.d === y.d) return x.d + ' ' + MON[x.m - 1] + ' ' + x.y;
  if (x.y === y.y && x.m === y.m) return x.d + '–' + y.d + ' ' + MON[x.m - 1] + ' ' + x.y;
  if (x.y === y.y) return x.d + ' ' + MON[x.m - 1] + ' – ' + y.d + ' ' + MON[y.m - 1] + ' ' + x.y;
  return x.d + ' ' + MON[x.m - 1] + ' ' + x.y + ' – ' + y.d + ' ' + MON[y.m - 1] + ' ' + y.y;
}
function fail(title, body) {
  document.getElementById('root').innerHTML =
    '<div class="card" style="max-width:520px;margin:60px auto;text-align:center">' +
    '<h2>' + esc(title) + '</h2><p class="sub" style="margin-top:8px">' + esc(body) + '</p></div>';
}

if (!TOKEN) {
  fail('This link is incomplete', 'The access link is missing its token. Ask your IGI contact to resend it.');
} else {
  fetch(SB + '/rpc/arp_client_report', {
    method: 'POST',
    headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: TOKEN })
  }).then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || d.status !== 'ok') {
        fail('This link is no longer active',
             'Access runs for a limited period and can be withdrawn at any time. '
           + 'Please contact IGI if you still need these results.');
        return;
      }
      render(d);
    })
    .catch(function () {
      fail('Could not load the report', 'Please try again in a moment.');
    });
}

function render(d) {
  var batches = d.batches || [];
  var all = [];
  batches.forEach(function (b) { (b.participants || []).forEach(function (p) { all.push(p); }); });
  var assessed = all.filter(function (p) { return p.readinessTotal != null; });

  var expires = (d.accessExpiresAt || '').slice(0, 10);
  var daysLeft = expires
    ? Math.max(0, Math.ceil((Date.parse(expires + 'T23:59:59Z') - Date.now()) / 86400000)) : null;

  var h = '<div class="hdr">'
    + '<div><h1>Team Readiness Report</h1><div class="who">' + esc(d.client) + '</div></div>'
    + '<div class="org"><b>IGI</b>International Gemological Institute<br>School of Gemology, India</div>'
    + '</div>';

  if (!batches.length) {
    h += '<div class="card"><h2>Nothing to show yet</h2><p class="sub">No training batches are '
       + 'recorded against your account yet. They appear here once a programme is set up.</p></div>';
    document.getElementById('root').innerHTML = h;
    return;
  }

  /* Headline numbers across every batch this manager can see. Averages are taken over
     the associates who actually sat the assessment, so a half-assessed batch does not
     read as a collapse in performance. */
  var avgR = assessed.length
    ? Math.round(assessed.reduce(function (t, p) { return t + p.readinessTotal; }, 0) / assessed.length) : null;
  var avgF = assessed.length
    ? Math.round(assessed.reduce(function (t, p) { return t + (Number(p.fcsPct) || 0); }, 0) / assessed.length) : null;
  var bands = {};
  assessed.forEach(function (p) { bands[p.readinessBand] = (bands[p.readinessBand] || 0) + 1; });

  h += '<div class="card">'
    + '<h2>At a glance</h2>'
    + '<p class="sub">Across ' + batches.length + ' programme' + (batches.length === 1 ? '' : 's') + '.</p>'
    + '<div class="kv">'
    +   '<div><span>Associates</span><b>' + all.length + '</b></div>'
    +   '<div><span>Assessed</span><b>' + assessed.length + '</b></div>'
    +   '<div><span>Avg readiness</span><b>' + (avgR == null ? '—' : avgR + '<small style="font-size:12px;color:var(--muted)">/100</small>') + '</b></div>'
    +   '<div><span>Avg diamond knowledge</span><b>' + (avgF == null ? '—' : avgF + '%') + '</b></div>'
    + '</div>';

  if (assessed.length) {
    h += '<div style="margin-top:6px">';
    ['Outstanding', 'Proficient', 'Developing', 'Foundation'].forEach(function (b) {
      var n = bands[b] || 0, pct = Math.round(n * 100 / assessed.length);
      h += '<div style="margin-bottom:7px">'
        + '<div style="display:flex;justify-content:space-between;font-size:12.5px">'
        + '<span>' + b + '</span><span><b>' + n + '</b> <small style="color:var(--muted)">' + pct + '%</small></span></div>'
        + '<div class="bar"><i style="width:' + pct + '%;background:' + BAND_COLOUR[b] + '"></i></div></div>';
    });
    h += '</div>'
      + '<div class="note"><b>How to read this.</b> Readiness is out of 100: diamond knowledge 40%, '
      + 'how consultatively the associate sells 35%, and how well they adapt to different customers 25%. '
      + 'It is a training map, not a performance rating.</div>';
  }
  h += '</div>';

  batches.forEach(function (b) {
    var ps = b.participants || [];
    var ass = ps.filter(function (p) { return p.readinessTotal != null; });
    var days = Number(b.trainingDays) || 1;
    var marked = ps.filter(function (p) { return p.daysAttended != null; });
    var avgAtt = marked.length
      ? Math.round(marked.reduce(function (t, p) { return t + Number(p.daysAttended); }, 0) / (marked.length * days) * 100)
      : null;

    h += '<div class="card">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">'
      +   '<div><h2>' + esc(b.programmeType === 'RTT' ? 'Retail Technical Training' : 'Corporate Training Programme') + '</h2>'
      +   '<p class="sub">' + esc(b.batchCode || '') + (b.centre ? ' &middot; ' + esc(b.centre) : '')
      +     (dateRange(b.trainingStart, b.trainingEnd) ? ' &middot; ' + esc(dateRange(b.trainingStart, b.trainingEnd)) : '')
      +   '</p></div>'
      + '</div>'
      + '<div class="kv">'
      +   '<div><span>Associates</span><b>' + ps.length + '</b></div>'
      +   '<div><span>Programme length</span><b>' + days + ' day' + (days === 1 ? '' : 's') + '</b></div>'
      +   '<div><span>Avg attendance</span><b>' + (avgAtt == null ? 'Not marked' : avgAtt + '%') + '</b></div>'
      +   '<div><span>Assessed</span><b>' + ass.length + ' of ' + ps.length + '</b></div>'
      + '</div>';

    if (!ps.length) {
      h += '<p class="sub">No associates on this roster yet.</p></div>';
      return;
    }

    h += '<div class="scroll"><table><thead><tr>'
      + '<th>#</th><th>ID</th><th>Name</th><th>Branch</th><th class="tc">Attendance</th>'
      + '<th class="tc">Readiness</th><th>Band</th><th class="tc">Diamond knowledge</th>'
      + '<th>Selling stage</th><th>Communication style</th>'
      + '</tr></thead><tbody>';

    ps.forEach(function (p, i) {
      var att = p.daysAttended == null
        ? '<span style="color:var(--muted)">—</span>'
        : (function () {
            var pc = Math.round(Number(p.daysAttended) / days * 100);
            var c = pc >= 75 ? '#166534' : pc > 0 ? '#92400e' : '#991b1b';
            return '<span style="color:' + c + ';font-weight:700">' + p.daysAttended + ' / ' + days + '</span>';
          })();
      var col = BAND_COLOUR[p.readinessBand] || 'var(--muted)';
      h += '<tr>'
        + '<td class="tc">' + (i + 1) + '</td>'
        + '<td style="font-family:DM Mono,monospace;font-size:11px">' + esc(p.participantId || '—') + '</td>'
        + '<td><b>' + esc(p.name) + '</b></td>'
        + '<td>' + esc(p.branch || '—') + '</td>'
        + '<td class="tc">' + att + '</td>'
        + '<td class="tc">' + (p.readinessTotal == null ? '<span style="color:var(--muted)">Not assessed</span>'
            : '<b style="color:' + col + ';font-size:15px">' + p.readinessTotal + '</b>') + '</td>'
        + '<td>' + (p.readinessBand
            ? '<span class="pill" style="background:' + col + '18;color:' + col + '">' + esc(p.readinessBand) + '</span>'
            : '—') + '</td>'
        + '<td class="tc">' + (p.fcsPct == null ? '—' : Math.round(p.fcsPct) + '%') + '</td>'
        + '<td style="font-size:12.5px">' + esc(STAGE_LABEL[p.rspStage] || '—') + '</td>'
        + '<td style="font-size:12.5px">' + esc(p.c2sLabel || '—') + '</td>'
        + '</tr>';
    });
    h += '</tbody></table></div></div>';
  });

  h += '<div class="card noprint" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">'
    + '<div class="sub">'
    +   (daysLeft != null
         ? 'This link stays active for ' + daysLeft + ' more day' + (daysLeft === 1 ? '' : 's') + '.'
         : '')
    +   ' Figures update as IGI records attendance and assessments.</div>'
    + '<button class="btn" onclick="window.print()">Save as PDF</button>'
    + '</div>';

  document.getElementById('root').innerHTML = h;
}
</script>
</body>
</html>
